name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: miway
          POSTGRES_PASSWORD: miway
          POSTGRES_DB: miway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miway -d miway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://miway:miway@localhost:5432/miway_test
      TEST_DATABASE_URL: postgresql://miway:miway@localhost:5432/miway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -q
