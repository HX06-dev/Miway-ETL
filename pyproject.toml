[project]
name = "miway-etl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "gtfs-realtime-bindings",
    "psycopg[binary]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests that use the configured PostgreSQL database"]

[tool.ruff]
line-length = 100